<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4f6f8">
    <title>Edit Note — YantramOps</title>
    <link rel="icon" type="image/png" href="/static/yantramops_logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --ink: #182230; --muted: #687586; --blue: #3768e5; --line: #e7ebf0; }
        body { background: #f4f6f8; color: var(--ink); font-family: 'DM Sans', sans-serif; }
        .navbar { background: rgba(255,255,255,.9); border-bottom: 1px solid var(--line); }
        .brand-name, h1, h2 { font-family: 'Manrope', sans-serif; }
        .brand-mark { width: 38px; height: 38px; object-fit: contain; }
        .nav-link { color: var(--muted); font-weight: 600; }
        .page-wrap { max-width: 1000px; }
        .hero { padding: 48px 0 26px; }
        .eyebrow { color: var(--blue); font-size: .75rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
        .hero h1 { font-size: clamp(2rem, 4vw, 3rem); font-weight: 800; letter-spacing: -.045em; }
        .surface { background: #fff; border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 10px 30px rgba(23,37,58,.045); padding: 28px; }
        .form-control { border-color: #dfe5ec; border-radius: 10px; padding: .8rem .9rem; }
        .form-control:focus { border-color: #8ba7f6; box-shadow: 0 0 0 .2rem rgba(55,104,229,.12); }
        .form-label { font-size: .9rem; font-weight: 600; }
        .important-control { background: #fffaf0; border: 1px solid #f2e3b8; border-radius: 11px; padding: 12px 14px; }
        .important-control .form-check-input:checked { background-color: #d99316; border-color: #d99316; }
        .btn-primary { background: var(--blue); border-color: var(--blue); border-radius: 10px; font-weight: 600; padding: .72rem 1.1rem; }
        @media (max-width: 575px) { .surface { padding: 20px; } }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-md">
        <div class="container-fluid px-3 px-lg-4">
            <a class="navbar-brand d-flex align-items-center gap-2 mb-0" href="/">
                <img class="brand-mark" src="/static/yantramops_logo.png" alt="YantramOps logo">
                <span class="brand-name fw-bold">YantramOps</span>
            </a>
            <div class="navbar-nav ms-auto flex-row align-items-center gap-3">
                <a class="nav-link" href="/">New Note</a>
                <a class="nav-link" href="/collection">Collection</a>
                <a class="nav-link" href="/about">About</a>
            </div>
        </div>
    </nav>
    <main class="container page-wrap pb-5">
        <header class="hero">
            <p class="eyebrow mb-2">Your collection</p>
            <h1 class="mb-2">Edit note</h1>
            <p class="text-secondary mb-0">Update the details and save your changes.</p>
        </header>
        <section class="surface" aria-label="Edit note form">
            <form method="post" action="/notes/{{ note.id }}/edit">
                <div class="mb-3">
                    <label for="title" class="form-label">Title</label>
                    <input class="form-control" id="title" name="title" type="text" maxlength="160" value="{{ note.title }}" required>
                </div>
                <div class="mb-3">
                    <label for="desc" class="form-label">Details</label>
                    <textarea class="form-control" id="desc" name="desc" rows="6" required>{{ note.desc }}</textarea>
                </div>
                <div class="d-flex flex-wrap align-items-center justify-content-between gap-3">
                    <label class="important-control d-flex align-items-center gap-2 mb-0">
                        <input class="form-check-input mt-0" type="checkbox" name="important" value="true" id="important" {% if note.important %}checked{% endif %}>
                        <span><strong class="d-block small">Mark as important</strong><span class="text-secondary small">Make this note stand out</span></span>
                    </label>
                    <div class="d-flex gap-2">
                        <a class="btn btn-light border rounded-3" href="/collection">Cancel</a>
                        <button class="btn btn-primary" type="submit">Save changes</button>
                    </div>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
